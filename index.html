<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Giao Việc Nguội</title>
<style>
  :root {
    --thaco-blue: #0033a0;
    --thaco-blue-light: #e8edfb;
    --ok: #1a9c4b;
    --err: #c0392b;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    width: 100%;
    overflow-x: hidden;
  }
  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: #fff;
    margin: 0;
    padding: 0;
    color: #1b1f27;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  @media (max-width: 400px) {
    body { padding: 10px; }
    .card { padding: 14px; }
  }
  .card {
    background: #fff;
    border-radius: 0;
    box-shadow: none;
    padding: 18px;
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
    flex: 1;
  }
  h1 { font-size: 18px; color: var(--thaco-blue); margin: 0 0 4px 0; }
  .sub { font-size: 12px; color: #667; margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  input, select {
  width: 100%; padding: 9px 10px; border: 1px solid #ccd2e0;
  border-radius: 6px; font-size: 16px;
}
  input:focus, select:focus { outline: none; border-color: var(--thaco-blue); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .lsx-row { display: flex; gap: 8px; align-items: flex-end; }
  .lsx-row > div:first-child { flex: 1; }
  button {
    margin-top: 16px; width: 100%; padding: 12px;
    background: var(--thaco-blue); color: #fff; border: none;
    border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  button.secondary {
    background: #fff; color: var(--thaco-blue);
    border: 1px solid var(--thaco-blue); margin-top: 8px;
  }
  button.qr-btn {
    margin-top: 0; width: 46px; height: 40px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  #lookupStatus { font-size: 13px; margin-top: 6px; min-height: 18px; }
  #lookupStatus.ok { color: var(--ok); }
  #lookupStatus.err { color: var(--err); }
  #previewBox {
    display: none; background: var(--thaco-blue-light); border-radius: 8px;
    padding: 10px 12px; font-size: 12.5px; margin-top: 8px; line-height: 1.6;
  }
  #previewBox b { color: var(--thaco-blue); }
  #resultBox {
    display: none; border-radius: 8px; padding: 12px;
    font-size: 13.5px; margin-top: 14px;
  }
  #resultBox.ok { background: #e9f9ee; color: #146c34; border: 1px solid #b7ebc6; }
  #resultBox.err { background: #fdecea; color: var(--err); border: 1px solid #f5c6c0; }

  #timePickerOverlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    z-index: 1000; align-items: center; justify-content: center; padding: 16px;
  }
  .picker-sheet {
    background: #fff; width: 100%; max-width: 280px; border-radius: 16px;
    padding: 16px 14px 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .picker-columns {
    display: flex; justify-content: center; gap: 24px; position: relative; height: 150px;
  }
  .picker-columns::before {
    content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 30px;
    transform: translateY(-50%); border-top: 1px solid #e3e6ee; border-bottom: 1px solid #e3e6ee;
    pointer-events: none;
  }
  .picker-col-wrap { display: flex; flex-direction: column; align-items: center; }
  .picker-col-label { font-size: 12px; color: #8a90a2; margin-bottom: 4px; width: 56px; text-align: center; }
  .picker-col {
    width: 56px; height: 150px; overflow-y: scroll; scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .picker-col::-webkit-scrollbar { display: none; }
  .picker-item {
    height: 30px; line-height: 30px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-variant-numeric: tabular-nums; color: #c7cbd6;
    scroll-snap-align: center; transition: opacity 0.15s, color 0.15s, transform 0.15s;
    user-select: none; transform: scale(1);
  }
  .picker-item.active { color: #1b1f27; font-weight: 600; transform: scale(1.06); }
  .picker-actions { display: flex; gap: 8px; margin-top: 14px; }
  .picker-actions button { margin-top: 0; flex: 1; border-radius: 20px; padding: 9px; font-size: 13.5px; }
  .picker-btn-secondary { background: #f0f1f5 !important; color: #4a4f5c !important; border: none !important; }

  /* Overlay quét QR */
  #qrOverlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 1100; flex-direction: column; align-items: center; justify-content: center; padding: 16px;
  }
  #qr-reader {
    width: 100%; max-width: 340px; aspect-ratio: 1 / 1;
    border-radius: 12px; overflow: hidden;
  }
  #qr-reader video {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
  }
  #qrOverlay .qr-hint { color: #fff; font-size: 13px; margin-top: 10px; text-align: center; }
  #qrOverlay button {
    max-width: 340px; margin-top: 14px; background: #fff; color: #1b1f27;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Giao Việc Nguội</h1>
  <div class="sub">Nhập LSX-STT (hoặc quét QR) để tự động lấy thông tin, sau đó nhập các thông số giao việc.</div>

  <label for="lsxStt">LSX-STT</label>
  <div class="lsx-row">
    <div>
      <input id="lsxStt" type="text" list="lsxSttList" autocomplete="off">
      <datalist id="lsxSttList"></datalist>
    </div>
    <button type="button" class="qr-btn" onclick="openQrScanner()" title="Quét mã QR">📷</button>
  </div>
  <div id="lookupStatus"></div>
  <div id="previewBox"></div>

  <div class="row2">
    <div>
      <label for="mayGC">Máy GC</label>
      <input id="mayGC" list="mayGCList" placeholder="Chọn hoặc nhập">
      <datalist id="mayGCList"></datalist>
    </div>
    <div>
      <label for="ngayGC">Ngày SX thực</label>
      <input id="ngayGC" type="date">
    </div>
  </div>

  <div class="row2">
    <div>
      <label for="slGiaoViec">SL/Giao việc</label>
      <input id="slGiaoViec" type="number" min="0" step="1">
    </div>
    <div>
      <label for="cycleTime">Cycle time/lần cắt (giây)</label>
      <input id="cycleTime" type="number" min="0" step="0.1">
    </div>
  </div>

  <div class="row2">
    <div>
      <label for="soPhoiLanCat">Số phôi/lần cắt</label>
      <input id="soPhoiLanCat" type="number" min="1" step="1" value="1">
    </div>
    <div>
      <label for="thoiGianBatDau">Thời gian bắt đầu</label>
      <input id="thoiGianBatDau" type="text" readonly placeholder="--:--" style="cursor:pointer;" onclick="openTimePicker()">
    </div>
  </div>

  <button id="btnSave" onclick="luuGiaoViec()">Lưu giao việc</button>
  <button class="secondary" onclick="resetForm()">Nhập mới</button>

  <div id="resultBox"></div>
</div>

<div id="timePickerOverlay">
  <div class="picker-sheet">
    <div class="picker-columns">
      <div class="picker-col-wrap">
        <div class="picker-col-label">Giờ</div>
        <div class="picker-col" id="pickerHourCol"></div>
      </div>
      <div class="picker-col-wrap">
        <div class="picker-col-label">Phút</div>
        <div class="picker-col" id="pickerMinuteCol"></div>
      </div>
    </div>
    <div class="picker-actions">
      <button type="button" class="secondary picker-btn-secondary" onclick="closeTimePicker()">Hủy</button>
      <button type="button" onclick="confirmTimePicker()">Hoàn tất</button>
    </div>
  </div>
</div>

<div id="qrOverlay">
  <div id="qr-reader"></div>
  <div class="qr-hint">Đưa mã QR vào giữa khung để quét</div>
  <button type="button" onclick="closeQrScanner()">Đóng</button>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  // ====== CẤU HÌNH KẾT NỐI APPS SCRIPT ======
  const API_URL = 'https://script.google.com/macros/s/AKfycbwvEGp8DC0_nvyW2fyW4X_jRsojlBL_M1edP0yY2khQ1xgtF6PJBTd4BqKmnmk47wgK/exec';
  const API_TOKEN = 'THAY_BANG_CHUOI_BI_MAT_CUA_BAN'; // phải khớp với CONFIG.API_TOKEN trong Code.gs

  function apiGet(action, params) {
    const url = new URL(API_URL);
    url.searchParams.set('action', action);
    url.searchParams.set('token', API_TOKEN);
    Object.keys(params || {}).forEach(function (k) {
      if (params[k] !== undefined && params[k] !== null) url.searchParams.set(k, params[k]);
    });
    return fetch(url.toString()).then(function (r) { return r.json(); });
  }

  function apiPost(data) {
    const url = new URL(API_URL);
    url.searchParams.set('token', API_TOKEN);
    return fetch(url.toString(), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // tránh CORS preflight
      body: JSON.stringify(data)
    }).then(function (r) { return r.json(); });
  }

  let dauVaoData = null;

  window.onload = function () {
    setDefaultDateTime();
    apiGet('layDanhSachMayGC').then(fillMayGCList).catch(function (e) { console.error(e); });
    initTimePicker();
  };

  // ---------------------- QUÉT QR ----------------------
  let html5QrCode = null;

  function xuLyKetQuaQr(decodedText) {
    // Mã QR có dạng: "Lệnh SX | STT chi tiết | Mã số | Tên chi tiết | Số lượng"
    // Ví dụ: "BUS.185/08 | 4 | 1006ZWZ0 | CTLK LƯỚT GIÓ | 24"
    const parts = decodedText.split('|').map(function (p) { return p.trim(); });

    if (parts.length < 5) {
      // Không đúng định dạng mong đợi -> xử lý như cũ (cả chuỗi là LSX-STT)
      document.getElementById('lsxStt').value = decodedText.trim();
      traCuuLsxStt(decodedText.trim());
      return;
    }

    const lenhSX = parts[0];
    const sttChiTiet = parts[1];
    const soLuong = parts[4];

    // Ghép Lệnh SX + STT chi tiết thành LSX-STT
    // ⚠️ Kiểm tra lại: cột LSX-STT trong sheet "ĐẦU VÀO" đang ghép bằng ký tự gì
    // (dấu "-", ".", "_" hay không dấu...). Đổi dấu nối bên dưới cho khớp.
    const lsxStt = lenhSX + '-' + sttChiTiet;

    document.getElementById('lsxStt').value = lsxStt;
    document.getElementById('slGiaoViec').value = soLuong;

    traCuuLsxStt(lsxStt);
  }

  function openQrScanner() {
    document.getElementById('qrOverlay').style.display = 'flex';
    html5QrCode = new Html5Qrcode('qr-reader');
    html5QrCode.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      function onScanSuccess(decodedText) {
        closeQrScanner();
        xuLyKetQuaQr(decodedText);
      },
      function onScanFailure() { /* bỏ qua, thử lại khung hình kế tiếp */ }
    ).catch(function (err) {
      alert('Không mở được camera: ' + err);
      closeQrScanner();
    });
  }

  function closeQrScanner() {
    document.getElementById('qrOverlay').style.display = 'none';
    if (html5QrCode) {
      html5QrCode.stop().then(function () { html5QrCode.clear(); }).catch(function () {});
      html5QrCode = null;
    }
  }

  // ---------------------- BOTTOM-SHEET CHỌN GIỜ/PHÚT ----------------------
  const PICKER_ITEM_HEIGHT = 30;
  let pickerHour = 10;
  let pickerMinute = 0;
  const pickerScrollTimers = {};

  function pad2(n) { return String(n).padStart(2, '0'); }

  function buildPickerColumn(containerId, count) {
    const el = document.getElementById(containerId);
    el.innerHTML = '';
    const spacer = PICKER_ITEM_HEIGHT * 2;
    el.style.paddingTop = spacer + 'px';
    el.style.paddingBottom = spacer + 'px';
    for (let i = 0; i < count; i++) {
      const div = document.createElement('div');
      div.className = 'picker-item';
      div.textContent = pad2(i);
      el.appendChild(div);
    }
  }

  function scrollPickerTo(containerId, value, smooth) {
    const el = document.getElementById(containerId);
    el.scrollTo({ top: value * PICKER_ITEM_HEIGHT, behavior: smooth ? 'smooth' : 'auto' });
  }

  function refreshPickerHighlight(containerId) {
    const el = document.getElementById(containerId);
    const items = el.children;
    const centerIndex = Math.round(el.scrollTop / PICKER_ITEM_HEIGHT);
    for (let i = 0; i < items.length; i++) {
      const dist = Math.abs(i - centerIndex);
      items[i].classList.toggle('active', dist === 0);
      items[i].style.opacity = dist === 0 ? '1' : (dist === 1 ? '0.45' : '0.2');
    }
    return centerIndex;
  }

  function initTimePicker() {
    const hourEl = document.getElementById('pickerHourCol');
    const minuteEl = document.getElementById('pickerMinuteCol');

    hourEl.addEventListener('scroll', function () {
      refreshPickerHighlight('pickerHourCol');
      clearTimeout(pickerScrollTimers.hour);
      pickerScrollTimers.hour = setTimeout(function () {
        let idx = Math.max(0, Math.min(23, Math.round(hourEl.scrollTop / PICKER_ITEM_HEIGHT)));
        scrollPickerTo('pickerHourCol', idx, true);
        pickerHour = idx;
      }, 120);
    });

    minuteEl.addEventListener('scroll', function () {
      refreshPickerHighlight('pickerMinuteCol');
      clearTimeout(pickerScrollTimers.minute);
      pickerScrollTimers.minute = setTimeout(function () {
        let idx = Math.max(0, Math.min(59, Math.round(minuteEl.scrollTop / PICKER_ITEM_HEIGHT)));
        scrollPickerTo('pickerMinuteCol', idx, true);
        pickerMinute = idx;
      }, 120);
    });
  }

  function openTimePicker() {
    const current = document.getElementById('thoiGianBatDau').value;
    let h = 10, m = 0;
    if (current && current.indexOf(':') !== -1) {
      const parts = current.split(':');
      h = parseInt(parts[0], 10) || 0;
      m = parseInt(parts[1], 10) || 0;
    }
    pickerHour = h;
    pickerMinute = m;

    buildPickerColumn('pickerHourCol', 24);
    buildPickerColumn('pickerMinuteCol', 60);

    document.getElementById('timePickerOverlay').style.display = 'flex';

    setTimeout(function () {
      scrollPickerTo('pickerHourCol', h, false);
      scrollPickerTo('pickerMinuteCol', m, false);
      refreshPickerHighlight('pickerHourCol');
      refreshPickerHighlight('pickerMinuteCol');
    }, 0);
  }

  function closeTimePicker() {
    document.getElementById('timePickerOverlay').style.display = 'none';
  }

  function confirmTimePicker() {
    document.getElementById('thoiGianBatDau').value = pad2(pickerHour) + ':' + pad2(pickerMinute);
    closeTimePicker();
  }

  function setDefaultDateTime() {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const dateStr = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
    document.getElementById('ngayGC').value = dateStr;
    document.getElementById('thoiGianBatDau').value = pad(now.getHours()) + ':' + pad(now.getMinutes());
  }

  function fillMayGCList(list) {
    const dl = document.getElementById('mayGCList');
    dl.innerHTML = '';
    (list || []).forEach(function (v) {
      const opt = document.createElement('option');
      opt.value = v;
      dl.appendChild(opt);
    });
  }

  let lsxDebounce = null;
  document.getElementById('lsxStt').addEventListener('input', function () {
    const val = this.value.trim();
    clearTimeout(lsxDebounce);
    if (val.length < 2) { fillLsxSttList([]); return; }
    lsxDebounce = setTimeout(function () {
      apiGet('goiYLsxStt', { prefix: val }).then(fillLsxSttList).catch(function () {});
    }, 250);
  });

  function fillLsxSttList(list) {
    const dl = document.getElementById('lsxSttList');
    dl.innerHTML = '';
    (list || []).forEach(function (v) {
      const opt = document.createElement('option');
      opt.value = v;
      dl.appendChild(opt);
    });
  }

  document.getElementById('lsxStt').addEventListener('blur', function () {
    traCuuLsxStt(this.value.trim());
  });

  function traCuuLsxStt(val) {
    const statusEl = document.getElementById('lookupStatus');
    const previewEl = document.getElementById('previewBox');
    dauVaoData = null;
    previewEl.style.display = 'none';

    if (!val) { statusEl.textContent = ''; return; }

    statusEl.className = '';
    statusEl.textContent = 'Đang tra cứu...';

    apiGet('timKiemDauVao', { lsxStt: val })
      .then(function (res) {
        if (res.found) {
          dauVaoData = res.data;
          statusEl.className = 'ok';
          statusEl.textContent = '✓ Đã tìm thấy thông tin.';
          previewEl.style.display = 'block';
          previewEl.innerHTML =
            '<b>Lệnh SX:</b> ' + safe(res.data.lenhSanXuat) + '<br>' +
            '<b>Sản phẩm:</b> ' + safe(res.data.sanPham) + ' &nbsp; <b>Tên chi tiết:</b> ' + safe(res.data.tenChiTiet) + '<br>' +
            '<b>Vật liệu:</b> ' + safe(res.data.vatLieu) + ' &nbsp; <b>SL/ĐH:</b> ' + safe(res.data.slDH) + '<br>' +
            '<b>Quy cách:</b> Dài ' + safe(res.data.dai) + ' / Rộng ' + safe(res.data.rong) + ' / Dày ' + safe(res.data.day) +
            ' / Dn ' + safe(res.data.dn) + ' / Dt ' + safe(res.data.dt);
        } else {
          statusEl.className = 'err';
          statusEl.textContent = '✗ ' + (res.message || res.error || 'Không tìm thấy.');
        }
      })
      .catch(function (err) {
        statusEl.className = 'err';
        statusEl.textContent = '✗ Lỗi: ' + err.message;
      });
  }

  function safe(v) { return (v === undefined || v === null || v === '') ? '—' : v; }

  function luuGiaoViec() {
    const btn = document.getElementById('btnSave');

    const form = {
      lsxStt: document.getElementById('lsxStt').value.trim(),
      mayGC: document.getElementById('mayGC').value.trim(),
      ngayGC: document.getElementById('ngayGC').value,
      slGiaoViec: document.getElementById('slGiaoViec').value,
      cycleTime: document.getElementById('cycleTime').value,
      soPhoiLanCat: document.getElementById('soPhoiLanCat').value || 1,
      thoiGianBatDau: document.getElementById('thoiGianBatDau').value
    };

    if (!form.lsxStt || !dauVaoData) {
      showResult(false, 'Vui lòng nhập LSX-STT hợp lệ và chờ tra cứu xong.');
      return;
    }
    if (!form.mayGC) { showResult(false, 'Vui lòng chọn/nhập Máy GC.'); return; }
    if (!form.thoiGianBatDau) { showResult(false, 'Vui lòng nhập Thời gian bắt đầu.'); return; }

    btn.disabled = true;
    btn.textContent = 'Đang lưu...';

    apiPost(form)
      .then(function (res) {
        btn.disabled = false;
        btn.textContent = 'Lưu giao việc';
        if (res.success) {
          showResult(true, res.message +
            '<br>Thời gian gia công: ' + res.tinhToan.tgPhut + ' phút (' + res.tinhToan.tgGio + ' giờ)' +
            '<br>Kết thúc dự kiến: ' + res.tinhToan.ketThucDuKien);
          clearInputsGiuKetQua();
        } else {
          showResult(false, res.message);
        }
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'Lưu giao việc';
        showResult(false, 'Lỗi: ' + err.message);
      });
  }

  function showResult(ok, html) {
    const box = document.getElementById('resultBox');
    box.style.display = 'block';
    box.className = ok ? 'ok' : 'err';
    box.innerHTML = html;
  }

  function resetForm() {
    document.getElementById('lsxStt').value = '';
    document.getElementById('mayGC').value = '';
    document.getElementById('slGiaoViec').value = '';
    document.getElementById('cycleTime').value = '';
    document.getElementById('soPhoiLanCat').value = 1;
    document.getElementById('lookupStatus').textContent = '';
    document.getElementById('previewBox').style.display = 'none';
    document.getElementById('resultBox').style.display = 'none';
    dauVaoData = null;
    setDefaultDateTime();
  }

  function clearInputsGiuKetQua() {
    document.getElementById('lsxStt').value = '';
    document.getElementById('mayGC').value = '';
    document.getElementById('slGiaoViec').value = '';
    document.getElementById('cycleTime').value = '';
    document.getElementById('soPhoiLanCat').value = 1;
    document.getElementById('lookupStatus').textContent = '';
    document.getElementById('previewBox').style.display = 'none';
    dauVaoData = null;
    setDefaultDateTime();
  }
</script>
</body>
</html>
